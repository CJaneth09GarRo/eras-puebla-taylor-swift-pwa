<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Swift</title>
  <desc id="desc">Poster estilo Eras con tonos morados y azules</desc>
  <defs>
