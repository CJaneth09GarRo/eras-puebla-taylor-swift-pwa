<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Midnights</title>
  <desc id="desc">Poster inspirada en la era Midnights</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="160" fill="#ffffff" fill-opacity="0.10"/>
  <circle cx="930" cy="620" r="240" fill="#f5d0fe" fill-opacity="0.28"/>
  <rect x="90" y="90" width="1020" height="720" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5"/>
  <text x="600" y="430" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" letter-spacing="8">MIDNIGHTS</text>
  <text x="600" y="520" text-anchor="middle" fill="#f5d0fe" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="12">MOONLIT</text>
</svg>
